<section class="flex felx-row gap-2 mt-2">
  <input
    type="text"
    class="input input-bordered mr-2 w-56"
    [placeholder]="placeholder()"
    autofocus
    #txtSearch
    (keydown.enter)="value.emit(txtSearch.value)"
  />
  <!-- estoy emitiendo el valor con emit -->
  <!-- //Cuando alguien le de enter, se ejecuta la funcion onSearch y le pasamos el valor del input  #txtSearch es una referencia interna-->

  <button class="btn btn-primary" (click)="value.emit(txtSearch.value)">
    Buscar
  </button>
</section>
